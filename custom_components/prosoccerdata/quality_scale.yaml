rules:
  # Bronze
  action-setup:
    status: done
    comment: |
      The mailbox and attendance actions are registered in async_setup and
      resolve their config entry at call time, raising ServiceValidationError
      when no loaded entry matches.
  appropriate-polling:
    status: done
    comment: |
      A ProSoccerData schedule changes a few times a week, so the coordinator
      polls every 30 minutes by default and the interval is configurable
      between 5 minutes and a day.
  brands:
    status: done
    comment: |
      A custom integration cannot be added to home-assistant/brands, so the
      icon and logo ship in brand/ instead, which Home Assistant 2026.3 and
      later prefer over the brands CDN.
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency:
    status: exempt
    comment: |
      The integration has no requirements; it talks to ProSoccerData over the
      aiohttp session Home Assistant provides.
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers.
  entity-event-setup:
    status: exempt
    comment: |
      Entities subscribe through CoordinatorEntity; the integration registers
      no callbacks of its own.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry:
    status: done
    comment: The account's email address is the unique id.

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable:
    status: done
    comment: |
      The shared base entity reports unavailable while the coordinator holds
      no data for that player, so one player's failure does not blank the
      others.
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: |
      A failing player or schedule is logged once when it starts failing and
      once when it recovers; the repeats in between go to debug.
  parallel-updates: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: |
      ProSoccerData is a cloud service reached with an account; there is
      nothing on the network to discover.
  discovery-update-info:
    status: exempt
    comment: Not discoverable, so there is no discovery information to update.
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices:
    status: exempt
    comment: The integration talks to a service, not to devices.
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices:
    status: todo
    comment: |
      A player added to the account shows up only after the options flow is
      used to select them.
  entity-category: todo
  entity-device-class: todo
  entity-disabled-by-default: todo
  entity-translations: done
  exception-translations: todo
  icon-translations: done
  reconfiguration-flow: todo
  repair-issues:
    status: exempt
    comment: |
      The only recoverable failure is a rejected password, which the
      reauthentication flow already raises.
  stale-devices:
    status: todo
    comment: |
      A player removed in the options flow leaves its device behind until it
      is deleted by hand.

  # Platinum
  async-dependency:
    status: done
    comment: The API client is async and has no blocking calls.
  inject-websession:
    status: done
    comment: |
      The client is handed the aiohttp session that async_create_clientsession
      builds, with a dummy cookie jar.
  strict-typing: todo
