rules:
  # Bronze
  action-setup:
    status: done
    comment: |
      The mailbox and attendance actions are registered in async_setup and
      resolve their config entry at call time, raising ServiceValidationError
      when no loaded entry matches.
  appropriate-polling:
    status: done
    comment: |
      A ProSoccerData schedule changes a few times a week, so the coordinator
      polls every 30 minutes by default and the interval is configurable
      between 5 minutes and a day.
  brands:
    status: done
    comment: |
      A custom integration cannot be added to home-assistant/brands, so the
      icon and logo ship in brand/ instead, which Home Assistant 2026.3 and
      later prefer over the brands CDN.
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency:
    status: exempt
    comment: |
      The integration has no requirements; it talks to ProSoccerData over the
      aiohttp session Home Assistant provides.
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers.
  entity-event-setup:
    status: exempt
    comment: |
      Entities subscribe through CoordinatorEntity; the integration registers
      no callbacks of its own.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry:
    status: done
    comment: The account's email address is the unique id.

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable:
    status: done
    comment: |
      The shared base entity reports unavailable while the coordinator holds
      no data for that player, so one player's failure does not blank the
      others.
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: |
      A failing player or schedule is logged once when it starts failing and
      once when it recovers; the repeats in between go to debug.
  parallel-updates: done
  reauthentication-flow:
    status: done
    comment: |
      A rejected session raises ConfigEntryAuthFailed, and the reauth step
      verifies the new password against ProSoccerData before storing it.
  test-coverage: done

  # Gold
  devices:
    status: done
    comment: |
      Every tracked player is a device, with the club platform as its model and
      the player's ProSoccerData page as its configuration URL.
  diagnostics:
    status: done
    comment: The dump redacts the password and the account's email address.
  discovery:
    status: exempt
    comment: |
      ProSoccerData is a cloud service reached with an account; there is
      nothing on the network to discover.
  discovery-update-info:
    status: exempt
    comment: Not discoverable, so there is no discovery information to update.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices:
    status: exempt
    comment: The integration talks to a service, not to devices.
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: |
      A ProSoccerData account can see every member of a club, so the players to
      follow are chosen by hand in the config and options flows rather than
      taken from the account wholesale. There is nothing left to pick up
      automatically: every selected player gets its device on the next reload,
      and the options flow reloads as soon as it is saved.
  entity-category:
    status: done
    comment: |
      The profile and account sensors describe the login and the paperwork
      rather than anything that happens on the pitch, so both are diagnostic.
  entity-device-class:
    status: done
    comment: |
      Timestamp on the next-match and next-training sensors, date on the
      last-match sensor and monetary on the three payment sensors. The rest are
      counts and free-text strings from an undocumented API; the payment status
      in particular is not an enum, because ProSoccerData does not publish the
      set of values it can send and a state outside `options` would be logged
      as an error.
  entity-disabled-by-default:
    status: done
    comment: |
      The account sensor is the same for every player on the account and is of
      no interest once setup worked, so it starts switched off.
  entity-translations: done
  exception-translations:
    status: done
    comment: |
      Every HomeAssistantError, ServiceValidationError, ConfigEntryAuthFailed,
      ConfigEntryNotReady and UpdateFailed raised by the integration carries a
      translation key, with English and Dutch messages.
  icon-translations: done
  reconfiguration-flow:
    status: done
    comment: |
      The reconfigure step re-enters the credentials and the player selection,
      and refuses a different account so the entry's unique id keeps matching.
  repair-issues:
    status: exempt
    comment: |
      The only recoverable failure is a rejected password, which the
      reauthentication flow already raises.
  stale-devices:
    status: done
    comment: |
      Dropping a player in the options or reconfigure flow removes its device
      on the reload that follows, and async_remove_config_entry_device lets a
      device be deleted by hand once its player is no longer tracked.
  # Platinum
  async-dependency:
    status: done
    comment: The API client is async and has no blocking calls.
  inject-websession:
    status: done
    comment: |
      The client is handed the aiohttp session that async_create_clientsession
      builds, with a dummy cookie jar.
  strict-typing: todo
